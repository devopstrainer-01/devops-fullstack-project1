# Front tier: reverse proxy in front of the Gunicorn/Flask app tier.

upstream app_upstream {
    # "app" is NOT a DNS name that exists on the internet -- it is the container
    # name / Compose service name, resolved by Docker's embedded DNS server on a
    # user-defined network. On the default bridge network this line would fail.
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # nginx's own liveness endpoint -- answers even when the app tier is down.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
